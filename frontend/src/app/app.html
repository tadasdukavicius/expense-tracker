<header class="site-header">
  <a class="brand" routerLink="/transactions">Expense Tracker</a>
  <nav aria-label="Main navigation">
    <a routerLink="/transactions" routerLinkActive="active">Transactions</a>
    <a routerLink="/categories" routerLinkActive="active">Categories</a>
    <a routerLink="/import" routerLinkActive="active">Import</a>
  </nav>
</header>

@if (activity.loading()) {
  <mat-progress-bar mode="indeterminate" aria-label="Loading"></mat-progress-bar>
}

@if (errors.message(); as message) {
  <div class="global-error" role="alert">
    <span>{{ message }}</span>
    <button type="button" (click)="errors.clear()">Dismiss</button>
  </div>
}

<router-outlet />
