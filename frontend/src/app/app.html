<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">Ledger</a>
    <nav aria-label="Main navigation">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>Overview</span>
      </a>
      <a routerLink="/transactions" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>Transactions</span>
      </a>
      <a routerLink="/categories" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><path d="M7.5 8h.01"/></svg>
        <span>Categories</span>
      </a>
      <a routerLink="/import" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v4h16v-4"/></svg>
        <span>Import</span>
      </a>
    </nav>
  </aside>

  <div class="main">
    @if (activity.loading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading"></mat-progress-bar>
    }

    @if (errors.message(); as message) {
      <div class="global-error" role="alert">
        <span>{{ message }}</span>
        <button type="button" (click)="errors.clear()">Dismiss</button>
      </div>
    }

    <router-outlet />
  </div>
</div>
